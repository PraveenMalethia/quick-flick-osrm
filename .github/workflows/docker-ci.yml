name: Docker Image CI/CD

on:
  push:
    branches:
      - main
      - staging
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    # OSRM processing (extract+partition+customize of a 222 MB PBF)
    # takes ~15-30 min. Default job timeout is 360 min — plenty.

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx (for cache)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PAT }}

      # Step 4: Extract short SHA for tagging
      - name: Set image tag
        id: meta
        run: echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      # Step 5: Sanitize branch name
      - name: Sanitize branch name
        id: vars
        run: echo "BRANCH_NAME=${GITHUB_REF#refs/heads/}" | sed 's/\//-/g' >> $GITHUB_ENV

      # Step 6: Build and push with tags
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:${{ env.BRANCH_NAME }}-latest
            ${{ vars.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:${{ env.BRANCH_NAME }}-${{ env.TAG }}

      # Step 7: Update/Notify DCF Repo
      - name: Update/Notify DCF Repo
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          BRANCH_NAME: ${{ env.BRANCH_NAME }}
          TAG: ${{ env.TAG }}
          DCF_REPO: ${{ github.repository_owner }}/${{ vars.DCF_REPO_NAME }}
          IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}
        run: |
          set -euo pipefail

          COMPOSE_FILE="docker-compose.${BRANCH_NAME}.yml"
          TMP_DIR=$(mktemp -d)

          # Authenticate GitHub CLI
          gh auth status

          echo "🔍 Checking if target GitHub repo '${DCF_REPO}' exists..."
          if ! gh repo view "${DCF_REPO}" &> /dev/null; then
            echo "❌ Repo not found or inaccessible."
            exit 0
          fi

          echo "📁 Cloning '${DCF_REPO}'..."
          cd "$TMP_DIR"
          gh repo clone "${DCF_REPO}"

          cd "$(basename "${DCF_REPO}")"

          if [[ ! -f "$COMPOSE_FILE" ]]; then
            echo "❌ Compose file '${COMPOSE_FILE}' not found. Skipping update."
            exit 0
          fi

          if ! grep -q "${IMAGE_NAME}:${BRANCH_NAME}" "$COMPOSE_FILE"; then
            echo "❌ Image '${IMAGE_NAME}:${BRANCH_NAME}' not found in '${COMPOSE_FILE}'. Skipping update."
            exit 0
          fi

          echo "🛠 Updating image tag in '${COMPOSE_FILE}'..."
          sed -i "s|image: ${IMAGE_NAME}:${BRANCH_NAME}-[a-zA-Z0-9._-]*|image: ${IMAGE_NAME}:${BRANCH_NAME}-${TAG}|" "$COMPOSE_FILE"

          # Git commit and push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git config url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

          if git diff --quiet; then
            echo "✅ No changes to commit."
          else
            echo "📦 Committing and pushing changes..."
            git commit -am "ci: update ${IMAGE_NAME} tag to ${BRANCH_NAME}-${TAG}"
            git push origin main
          fi

          echo "✅ Update completed."